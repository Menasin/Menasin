<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="50%" stop-color="#0a0f16" />
      <stop offset="100%" stop-color="#06090d" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Divider Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0" />
      <stop offset="20%" stop-color="#00ff66" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>

    <!-- Scanline Pattern for Authentic CRT/Cyber Terminal Texture -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .prompt-bracket { fill: #38bdf8; font-weight: 600; }
    .prompt-user { fill: #00ff66; font-weight: 700; }
    .prompt-path { fill: #ffffff; font-weight: 600; }
    .prompt-hash { fill: #f43f5e; font-weight: 700; }
    .cmd-text { fill: #f0f6fc; font-weight: 600; }
    .json-bracket { fill: #8b949e; }
    .json-key { fill: #58a6ff; font-weight: 500; }
    .json-str { fill: #7ee787; }
    .json-status { fill: #00ff66; font-weight: 600; }
    .json-mars { fill: #ff7b72; font-weight: 600; }
    .json-cyber { fill: #f0883e; }
    .eof-tag { fill: #e3b341; font-weight: 600; }
    .hud-title { fill: #00e5ff; font-weight: 700; letter-spacing: 1px; }
    .hud-label { fill: #8b949e; font-weight: 500; }
    .hud-val { fill: #f0f6fc; font-weight: 600; }
    .hud-green { fill: #00ff66; font-weight: 700; }
    .hud-bar { fill: #00ff66; }
    .hud-bar-empty { fill: #21262d; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Fira Code", monospace; font-size: 13px; }
  </style>

  <!-- Outer Card Frame with Neon Cyber Accent -->
  <rect x="1" y="1" width="798" height="458" rx="10" fill="url(#terminalBg)" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.45" />
  <rect x="0" y="0" width="800" height="460" rx="10" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.12" />

  <!-- Subtle CRT Scanline Texture Layer -->
  <rect x="2" y="38" width="796" height="420" fill="url(#scanlines)" pointer-events="none" />

  <!-- Corner Tech Accents -->
  <path d="M 1 20 L 1 1 L 20 1" stroke="#00ff66" stroke-width="2.5" fill="none" />
  <path d="M 780 1 L 799 1 L 799 20" stroke="#00ff66" stroke-width="2.5" fill="none" />
  <path d="M 1 440 L 1 459 L 20 459" stroke="#00ff66" stroke-width="2.5" fill="none" />
  <path d="M 780 459 L 799 459 L 799 440" stroke="#00ff66" stroke-width="2.5" fill="none" />

  <!-- Terminal Header Bar -->
  <path d="M 1 10 C 1 5, 5 1, 10 1 L 790 1 C 795 1, 799 5, 799 10 L 799 38 L 1 38 Z" fill="url(#headerGrad)" stroke="#30363d" stroke-width="0.8" />

  <!-- Window Controls (Red, Yellow, Green) -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="400" y="24" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">
    mars-station :: operator@men4sin:~ (zsh)
  </text>

  <!-- Live Pulse Status -->
  <circle cx="748" cy="19" r="4" fill="#00ff66">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="758" y="23" fill="#00ff66" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">LIVE</text>

  <!-- Vertical Divider Separating Left Shell and Right Telemetry HUD -->
  <line x1="435" y1="55" x2="435" y2="430" stroke="url(#dividerGrad)" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- LEFT SECTION: Kali Shell & JSON Heredoc -->
  <g class="mono" transform="translate(24, 64)">
    <!-- Prompt Line 1 -->
    <text y="0">
      <tspan class="prompt-bracket">┌──(</tspan><tspan class="prompt-user">operator㉿mars-station</tspan><tspan class="prompt-bracket">)-[</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-bracket">]</tspan>
    </text>

    <!-- Prompt Line 2 & Command -->
    <text y="23">
      <tspan class="prompt-hash">└─# </tspan><tspan class="cmd-text">cat &lt;&lt; 'EOF' &gt; status.json</tspan>
    </text>

    <!-- JSON Opening -->
    <text y="46">
      <tspan class="json-bracket">{</tspan>
    </text>

    <!-- operator -->
    <text y="68">
      <tspan class="json-key">  "operator": </tspan><tspan class="json-str">"MEN4SIN"</tspan><tspan class="json-bracket">,</tspan>
    </text>

    <!-- faction -->
    <text y="90">
      <tspan class="json-key">  "faction": </tspan><tspan class="json-str">"HXCBFX"</tspan><tspan class="json-bracket">,</tspan>
    </text>

    <!-- status -->
    <text y="112">
      <tspan class="json-key">  "status": </tspan><tspan class="json-status">"Status: OPTIMAL"</tspan><tspan class="json-bracket">,</tspan>
    </text>

    <!-- coordinates -->
    <text y="134">
      <tspan class="json-key">  "coordinates": </tspan><tspan class="json-mars">"Pinging Mars 🛰️"</tspan><tspan class="json-bracket">,</tspan>
    </text>

    <!-- specialization array header -->
    <text y="156">
      <tspan class="json-key">  "specialization": </tspan><tspan class="json-bracket">[</tspan>
    </text>

    <!-- specialization items -->
    <text y="178">
      <tspan class="json-str">    "High-Perf Architecture"</tspan><tspan class="json-bracket">,</tspan>
    </text>
    <text y="200">
      <tspan class="json-cyber">    "Offensive/Defensive Cyber"</tspan><tspan class="json-bracket">,</tspan>
    </text>
    <text y="222">
      <tspan class="json-str">    "Distributed Systems"</tspan><tspan class="json-bracket">,</tspan>
    </text>
    <text y="244">
      <tspan class="json-cyber">    "Zero Trust &amp; DevSecOps"</tspan>
    </text>

    <!-- array & json close -->
    <text y="266">
      <tspan class="json-bracket">  ]</tspan>
    </text>
    <text y="288">
      <tspan class="json-bracket">}</tspan>
    </text>

    <!-- EOF -->
    <text y="310">
      <tspan class="eof-tag">EOF</tspan>
    </text>

    <!-- Next Prompt Line -->
    <text y="334">
      <tspan class="prompt-bracket">┌──(</tspan><tspan class="prompt-user">operator㉿mars-station</tspan><tspan class="prompt-bracket">)-[</tspan><tspan class="prompt-path">~</tspan><tspan class="prompt-bracket">]</tspan>
    </text>
    <text y="356">
      <tspan class="prompt-hash">└─# </tspan><tspan fill="#00ff66">█</tspan>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </text>
  </g>

  <!-- RIGHT SECTION: Telemetry Mission Control & Hardened Specs HUD -->
  <g class="mono" transform="translate(458, 64)">
    <!-- HUD Header Box -->
    <rect x="0" y="0" width="318" height="28" rx="5" fill="#121820" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="14" cy="14" r="3.5" fill="#00e5ff" />
    <text x="26" y="18" class="hud-title" font-size="11.5">STATION TELEMETRY // MARS</text>

    <!-- Key Metrics Grid -->
    <g transform="translate(4, 48)" font-size="12">
      <text y="0">
        <tspan class="hud-label">TARGET : </tspan><tspan class="hud-val">hx-cb.network</tspan>
      </text>
      <text y="22">
        <tspan class="hud-label">KERNEL : </tspan><tspan class="hud-val">6.10-hardened-sec</tspan>
      </text>
      <text y="44">
        <tspan class="hud-label">POLICY : </tspan><tspan class="hud-green">ZERO TRUST [ACTIVE]</tspan>
      </text>
      <text y="66">
        <tspan class="hud-label">CIPHER : </tspan><tspan class="hud-val">AES-256-GCM / TLS1.3</tspan>
      </text>
      <text y="88">
        <tspan class="hud-label">UPLINK : </tspan><tspan class="hud-green">99.99% ULTRA-LOW</tspan>
      </text>
    </g>

    <!-- Sub-Box: Neural Grid Load Meters -->
    <g transform="translate(0, 164)">
      <rect x="0" y="0" width="318" height="154" rx="6" fill="#0c1117" stroke="#21262d" stroke-width="1" />
      
      <!-- Sub-header -->
      <text x="14" y="22" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">SYSTEM RESOURCES</text>
      <line x1="14" y1="30" x2="304" y2="30" stroke="#21262d" stroke-width="0.8" />

      <!-- Metric 1: Core Processing -->
      <text x="14" y="50" font-size="11" class="hud-label">CORE ARCHITECTURE</text>
      <text x="268" y="50" font-size="11" class="hud-green">94%</text>
      <text x="14" y="66" font-size="11">
        <tspan class="hud-bar">■■■■■■■■■■■■■■■■■■■</tspan><tspan class="hud-bar-empty">■</tspan>
      </text>

      <!-- Metric 2: Cyber Shielding -->
      <text x="14" y="92" font-size="11" class="hud-label">CYBER SHIELD DEFENSE</text>
      <text x="262" y="92" font-size="11" class="hud-green">100%</text>
      <text x="14" y="108" font-size="11">
        <tspan class="hud-bar">■■■■■■■■■■■■■■■■■■■■</tspan>
      </text>

      <!-- Metric 3: Mars Uplink Sync -->
      <text x="14" y="132" font-size="10.5" fill="#8b949e">BEACON: <tspan fill="#39d353">SYNCHRONIZED</tspan> • <tspan fill="#f0883e">MARS-01</tspan></text>
    </g>
  </g>
</svg>
