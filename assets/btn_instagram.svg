<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 54" width="250" height="54">
  <defs>
    <!-- Glassmorphic Background Gradient -->
    <linearGradient id="glassBgInsta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241525" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e0a12" stop-opacity="0.92" />
    </linearGradient>

    <!-- Frosted Glass Rim / Border Gradient -->
    <linearGradient id="glassBorderInsta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1306c" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#fd1d1d" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f56040" stop-opacity="0.2" />
    </linearGradient>

    <!-- Instagram Accent Gradient -->
    <linearGradient id="instaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf497" />
      <stop offset="5%" stop-color="#fdf497" />
      <stop offset="45%" stop-color="#fd5949" />
      <stop offset="60%" stop-color="#d6249f" />
      <stop offset="90%" stop-color="#285aeb" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glassGlossInsta" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="instaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Glass Base -->
  <rect x="2" y="2" width="246" height="50" rx="10" fill="url(#glassBgInsta)" stroke="url(#glassBorderInsta)" stroke-width="1.2" />

  <!-- Top Gloss Highlight Strip -->
  <path d="M 3 12 C 3 6, 7 3, 13 3 L 237 3 C 243 3, 247 6, 247 12 L 247 22 L 3 22 Z" fill="url(#glassGlossInsta)" opacity="0.6" />

  <!-- Corner Tech Accent Dots -->
  <circle cx="8" cy="8" r="1.5" fill="#e1306c" opacity="0.8" />
  <circle cx="242" cy="8" r="1.5" fill="#e1306c" opacity="0.8" />

  <!-- Instagram Glyph Icon -->
  <g transform="translate(18, 14)" stroke="url(#instaGrad)" stroke-width="1.8" fill="none" filter="url(#instaGlow)">
    <rect x="2" y="2" width="22" height="22" rx="6" />
    <circle cx="13" cy="13" r="5" />
    <circle cx="18.5" cy="7.5" r="1" fill="#fd5949" stroke="none" />
  </g>

  <!-- Text Container -->
  <g transform="translate(54, 21)" font-family="ui-monospace, SFMono-Regular, 'Fira Code', Menlo, Consolas, monospace">
    <!-- Subtitle / Status -->
    <text x="0" y="0" font-size="9" fill="#ff70a6" font-weight="700" letter-spacing="1.2">TRANSMISSION // FEED</text>
    <!-- Main Label -->
    <text x="0" y="17" font-size="12.5" fill="#f0f6fc" font-weight="600" letter-spacing="0.4">@men4sin</text>
  </g>

  <!-- Arrow Indicator -->
  <path d="M 226 27 L 232 27 M 229 24 L 232 27 L 229 30" stroke="#e1306c" stroke-width="1.5" fill="none" opacity="0.7" />
</svg>
