<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 54" width="250" height="54">
  <defs>
    <!-- Glassmorphic Background Gradient -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16202c" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b1118" stop-opacity="0.92" />
    </linearGradient>

    <!-- Frosted Glass Rim / Border Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Top Gloss Reflection -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Button Glass Base -->
  <rect x="2" y="2" width="246" height="50" rx="10" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1.2" />

  <!-- Top Gloss Highlight Strip -->
  <path d="M 3 12 C 3 6, 7 3, 13 3 L 237 3 C 243 3, 247 6, 247 12 L 247 22 L 3 22 Z" fill="url(#glassGloss)" opacity="0.6" />

  <!-- Corner Tech Accent Dots -->
  <circle cx="8" cy="8" r="1.5" fill="#00ff66" opacity="0.8" />
  <circle cx="242" cy="8" r="1.5" fill="#00ff66" opacity="0.8" />

  <!-- Globe / Uplink Icon -->
  <g transform="translate(18, 14)" stroke="#00ff66" stroke-width="1.6" fill="none" filter="url(#accentGlow)">
    <circle cx="13" cy="13" r="11" />
    <path d="M 2 13 L 24 13" />
    <ellipse cx="13" cy="13" rx="5.5" ry="11" />
  </g>

  <!-- Text Container -->
  <g transform="translate(54, 21)" font-family="ui-monospace, SFMono-Regular, 'Fira Code', Menlo, Consolas, monospace">
    <!-- Subtitle / Status -->
    <text x="0" y="0" font-size="9" fill="#00ff66" font-weight="700" letter-spacing="1.2">WEBSITE // IN ORBIT</text>
    <!-- Main Label -->
    <text x="0" y="17" font-size="12.5" fill="#f0f6fc" font-weight="600" letter-spacing="0.4">Deploying Soon . . .</text>
  </g>

  <!-- Arrow Indicator -->
  <path d="M 226 27 L 232 27 M 229 24 L 232 27 L 229 30" stroke="#00ff66" stroke-width="1.5" fill="none" opacity="0.7" />
</svg>
