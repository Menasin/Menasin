name: Update Streak Telemetry

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-streak.yml'
      - 'generate_streak.py'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Streak Telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_streak.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git commit -m "chore(telemetry): auto-update contribution streak card" || exit 0
          git push
